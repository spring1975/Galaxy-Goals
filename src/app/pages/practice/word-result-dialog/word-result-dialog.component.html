@if (data.isCorrect && !data.wasRevealed) {

<h2 mat-dialog-title>
  <mat-icon class="success-icon">check_circle</mat-icon>
</h2>
<mat-dialog-content>
  <p >Nice! '{{data.word}}' is correct.</p>
</mat-dialog-content>

}
@else if (data.wasRevealed) {

<h2 mat-dialog-title>
  <mat-icon class="info-icon">info</mat-icon>
</h2>
<mat-dialog-content>
  <p>The answer was '{{data.word}}'.</p>
  <p>Let's keep practicing!</p>
</mat-dialog-content>

}

<mat-dialog-actions>
  <button mat-button mat-dialog-close color="primary">
    <mat-icon>arrow_forward</mat-icon>
    Next
  </button>
</mat-dialog-actions>
