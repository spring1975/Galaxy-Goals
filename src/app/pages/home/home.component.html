<div class="home-container" style="display: flex; flex-direction: column; gap: 16px;">

  <div class="add-list-container">
    <button mat-stroked-button color="primary" aria-label="Add New List">
      <mat-icon aria-hidden="false" aria-label="Add New List">add</mat-icon> Add New List
    </button>
  </div>

  <mat-card class="welcome-card">
    <mat-card-header>
      <mat-card-title>Welcome to Galaxy Goals</mat-card-title>
      <mat-card-subtitle>Your journey to achieve stellar goals starts here</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p>
        This is your home base for tracking and achieving your goals.
        Start your stellar journey today!
      </p>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-raised-button color="primary">Get Started</button>
    </mat-card-actions>
  </mat-card>

</div>
