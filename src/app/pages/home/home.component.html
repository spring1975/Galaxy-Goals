<div class="home-container" style="display: flex; flex-direction: column; gap: 16px;">

  <button mat-stroked-button color="primary" class="full-width-button large-button" aria-label="Add New List">
      <mat-icon aria-hidden="false" aria-label="Add New List">add</mat-icon> Add New List
    </button>

  @for (list of spellingLists; track list.week) {
    <mat-card>
      <mat-card-header>
        <mat-card-title>Week {{ list.week }} &mdash; {{ list.title }}</mat-card-title>
        <mat-card-subtitle>{{ list.wordCount }} words &mdash; Last practiced &ndash; {{ list.lastPracticed | fromNow }}</mat-card-subtitle>
        <div class="score">
          @if (list.percent){
            <mat-progress-spinner
              class="ring progress"
              mode="determinate"
              [value]="list.percent"
              [diameter]="56"
              [strokeWidth]="6">
            </mat-progress-spinner>
            <div class="label mat-title-small">{{ list.percent }}%</div>
          }
        </div>
      </mat-card-header>
      <mat-card-content>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="secondary">Practice</button>
        <button mat-raised-button color="secondary">Test</button>
        <button mat-raised-button color="secondary">Edit</button>
        <button mat-raised-button color="secondary">Delete</button>
      </mat-card-actions>
    </mat-card>
  }
</div>
