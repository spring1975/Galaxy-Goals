<div class="home-container" style="display: flex; flex-direction: column; gap: 16px;">

  <button mat-stroked-button color="primary" class="full-width-button large-button" aria-label="Add New List"
    (click)="addList()">
    <mat-icon aria-hidden="false" aria-label="Add New List">add</mat-icon> Add New List
  </button>

  @for (list of spellingLists(); track list.id) {
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ list.name }}</mat-card-title>
      <mat-card-subtitle>{{ list.words.length }} words &mdash; Last practiced <mat-icon
          aria-hidden="true">arrow_right</mat-icon>{{ list.lastPracticed | fromNow}}</mat-card-subtitle>
      <!-- Progress ring can be added when accuracy is tracked -->
    </mat-card-header>
    <mat-card-content>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="secondary" (click)="practiceList(list.id)">Practice</button>
      <button mat-raised-button color="secondary">Results</button>
      <button mat-raised-button color="secondary" (click)="editList(list.id)">Edit</button>
      <button mat-raised-button color="secondary" (click)="deleteList(list.id)">Delete</button>
    </mat-card-actions>
  </mat-card>
  }
</div>
